[package]
name    = "manguesechee-agent"
version = "0.1.0"
edition = "2021"
description = "Background agent daemon — discovery, session management, IPC"

[[bin]]
name = "manguesechee-agent"
path = "src/main.rs"

[dependencies]
manguesechee-core    = { workspace = true }
manguesechee-network = { workspace = true }
manguesechee-input   = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }
rand               = { workspace = true }
serde_json         = { workspace = true }
dirs               = { workspace = true }
arboard = { workspace = true }
